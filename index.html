<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cathedral-Engine // 3D Sovereign Viewport</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050608; color: #e2e8f0; font-family: monospace; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #hud {
            position: absolute; top: 16px; left: 16px; z-index: 10;
            background: rgba(10, 12, 18, 0.85); border: 1px solid rgba(235, 185, 45, 0.4);
            padding: 14px 18px; border-radius: 6px; pointer-events: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        .title { color: #fbbf24; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        .stat { font-size: 11px; color: #94a3b8; margin: 2px 0; }
        .val { color: #38bdf8; font-weight: bold; }
        #controls-hint {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 12, 18, 0.8); border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 8px 16px; border-radius: 20px; font-size: 11px; color: #cbd5e1;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="hud">
        <div class="title">CATHEDRAL-ENGINE // SANCTUM APEX</div>
        <div class="stat">Chamber: <span class="val">Chamber V (Core Monad)</span></div>
        <div class="stat">Coordinates: <span class="val">(4, 4) [Monad Altar]</span></div>
        <div class="stat">Carrier Wave: <span class="val">130.81 Hz [Gold-Obsidian]</span></div>
        <div class="stat">Ash Ledger: <span class="val">Block #41 [Merkle Locked]</span></div>
        <div class="stat">Axiom: <span class="val">EMOTION = PHYSICS = MAGIC = BIOLOGY = ARCHITECTURE</span></div>
    </div>
    <div id="controls-hint">Left Click + Drag: Rotate | Scroll: Zoom | Right Click: Pan</div>
    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x07080c);
        scene.fog = new THREE.FogExp2(0x07080c, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // Lighting
        const ambient = new THREE.AmbientLight(0x1a1c24, 0.8);
        scene.add(ambient);

        const altarLight = new THREE.PointLight(0xffb703, 3.5, 35, 1.2);
        altarLight.position.set(0, 3, 0);
        altarLight.castShadow = true;
        scene.add(altarLight);

        const windowLight = new THREE.DirectionalLight(0x38bdf8, 2.0);
        windowLight.position.set(0, 15, -25);
        windowLight.target.position.set(0, 0, 0);
        scene.add(windowLight);

        // Materials
        const basaltMat = new THREE.MeshStandardMaterial({ color: 0x16181f, roughness: 0.85, metalness: 0.2 });
        const goldFiligreeMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.3, metalness: 0.8, emissive: 0x553300 });
        const glowingCyanMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        const stainedGlassMat = new THREE.MeshBasicMaterial({ color: 0x0284c7, transparent: true, opacity: 0.65 });

        // Floor
        const floorGeo = new THREE.PlaneGeometry(50, 50, 25, 25);
        const floorMesh = new THREE.Mesh(floorGeo, basaltMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        const gridHelper = new THREE.GridHelper(50, 25, 0xfbbf24, 0x1e293b);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Pillars
        const pillarGeo = new THREE.CylinderGeometry(0.7, 0.85, 16, 12);
        const archPositions =;
        const archZPositions =;

        archPositions.forEach(x => {
            archZPositions.forEach(z => {
                const pillar = new THREE.Mesh(pillarGeo, basaltMat);
                pillar.position.set(x, 8, z);
                pillar.castShadow = true;
                pillar.receiveShadow = true;
                scene.add(pillar);

                const capitalGeo = new THREE.BoxGeometry(1.8, 0.6, 1.8);
                const capital = new THREE.Mesh(capitalGeo, goldFiligreeMat);
                capital.position.set(x, 16, z);
                scene.add(capital);
            });
        });

        // Core Monad Altar
        const altarBaseGeo = new THREE.CylinderGeometry(3.5, 4.2, 1.2, 8);
        const altarBase = new THREE.Mesh(altarBaseGeo, basaltMat);
        altarBase.position.set(0, 0.6, 0);
        altarBase.receiveShadow = true;
        scene.add(altarBase);

        const altarPillarGeo = new THREE.BoxGeometry(1.6, 2.8, 1.6);
        const altarPillar = new THREE.Mesh(altarPillarGeo, basaltMat);
        altarPillar.position.set(0, 2.4, 0);
        altarPillar.castShadow = true;
        scene.add(altarPillar);

        const oculusGeo = new THREE.OctahedronGeometry(0.8, 0);
        const oculusMesh = new THREE.Mesh(oculusGeo, goldFiligreeMat);
        oculusMesh.position.set(0, 4.5, 0);
        scene.add(oculusMesh);

        const ringGeo = new THREE.TorusGeometry(1.6, 0.06, 8, 32);
        const ringMesh = new THREE.Mesh(ringGeo, glowingCyanMat);
        ringMesh.position.set(0, 4.5, 0);
        ringMesh.rotation.x = Math.PI / 3;
        scene.add(ringMesh);

        const windowFrameGeo = new THREE.BoxGeometry(8, 16, 0.4);
        const windowFrame = new THREE.Mesh(windowFrameGeo, stainedGlassMat);
        windowFrame.position.set(0, 10, -22);
        scene.add(windowFrame);

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            oculusMesh.rotation.y = elapsed * 0.8;
            oculusMesh.rotation.x = elapsed * 0.4;
            ringMesh.rotation.z = -elapsed * 0.6;
            ringMesh.rotation.y = elapsed * 0.3;

            altarLight.intensity = 3.0 + Math.sin(elapsed * 4.0) * 0.8;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
