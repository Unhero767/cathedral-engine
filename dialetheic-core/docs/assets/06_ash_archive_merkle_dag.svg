<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66fcf1" />
      <stop offset="100%" stop-color="#1f2833" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="#0b0c10" rx="10"/>
  <text x="250" y="35" fill="#66fcf1" font-family="Courier New" font-size="18" font-weight="bold" text-anchor="middle">ASH ARCHIVE :: MERKLE DAG LEDGER</text>

  <!-- Root Hash -->
  <rect x="180" y="70" width="140" height="45" fill="#1f2833" stroke="#ffd700" stroke-width="2" rx="4"/>
  <text x="250" y="90" fill="#ffd700" font-family="Courier New" font-size="11" font-weight="bold" text-anchor="middle">J_hash Root</text>
  <text x="250" y="105" fill="#aaa" font-family="Courier New" font-size="9" text-anchor="middle">Justified Belief</text>

  <!-- Intermediate Nodes -->
  <line x1="210" y1="115" x2="130" y2="170" stroke="#66fcf1" stroke-width="2"/>
  <line x1="290" y1="115" x2="370" y2="170" stroke="#66fcf1" stroke-width="2"/>

  <rect x="70" y="170" width="120" height="40" fill="#11151c" stroke="#66fcf1" stroke-width="2" rx="4"/>
  <text x="130" y="195" fill="#66fcf1" font-family="Courier New" font-size="10" text-anchor="middle">Stratum I Node</text>

  <rect x="310" y="170" width="120" height="40" fill="#11151c" stroke="#66fcf1" stroke-width="2" rx="4"/>
  <text x="370" y="195" fill="#66fcf1" font-family="Courier New" font-size="10" text-anchor="middle">Stratum II Node</text>

  <!-- Leaf Scars -->
  <rect x="30" y="270" width="90" height="35" fill="#1f2833" stroke="#8b4513" stroke-width="2" rx="3"/>
  <text x="75" y="292" fill="#8b4513" font-family="Courier New" font-size="9" text-anchor="middle">Scar 0001</text>

  <rect x="150" y="270" width="90" height="35" fill="#1f2833" stroke="#8b4513" stroke-width="2" rx="3"/>
  <text x="195" y="292" fill="#8b4513" font-family="Courier New" font-size="9" text-anchor="middle">Scar 0002</text>

  <rect x="270" y="270" width="90" height="35" fill="#1f2833" stroke="#8b4513" stroke-width="2" rx="3"/>
  <text x="315" y="292" fill="#8b4513" font-family="Courier New" font-size="9" text-anchor="middle">Scar 0003</text>

  <rect x="390" y="270" width="90" height="35" fill="#1f2833" stroke="#8b4513" stroke-width="2" rx="3"/>
  <text x="435" y="292" fill="#8b4513" font-family="Courier New" font-size="9" text-anchor="middle">Scar 0004</text>

  <text x="250" y="360" fill="#aaa" font-family="Courier New" font-size="11" text-anchor="middle">Never-Overwrite Doctrine: Append-Only Immutable History</text>
</svg>
