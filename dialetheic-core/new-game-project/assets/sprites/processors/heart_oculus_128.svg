  <circle cx="64" cy="64" r="50" fill="none" stroke="#FFF3D1" stroke-width="4"/>
  <!-- Outer 12 Sensory Ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#2C5A96" stroke-width="6" stroke-dasharray="8 4"/>
  <!-- Mid 12 Emotional Ring -->
  <circle cx="64" cy="64" r="28" fill="none" stroke="#C99738" stroke-width="6" stroke-dasharray="6 3"/>
  <!-- Core 12 Memory Ring -->
  <circle cx="64" cy="64" r="14" fill="none" stroke="#BA2D2D" stroke-width="4" stroke-dasharray="4 2"/>
  <!-- Bio-Luminous Core -->
  <circle cx="64" cy="64" r="6" fill="#55E6F2"/>
  <circle cx="64" cy="64" r="3" fill="#DDFBFF"/>
</svg>
