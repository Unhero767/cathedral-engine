<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <rect width="128" height="128" fill="#0A0C10" />
  <!-- Cyan Key of Breadth (Gyroscope) -->
  <!-- Outer Ring -->
  <circle cx="36" cy="40" r="18" fill="none" stroke="#181B22" stroke-width="4"/>
  <circle cx="36" cy="40" r="14" fill="none" stroke="#1BB2BF" stroke-width="2"/>
  <!-- Rotating Inner Gyro -->
  <ellipse cx="36" cy="40" rx="10" ry="4" fill="none" stroke="#55E6F2" stroke-width="2"/>
  <rect x="34" y="38" width="4" height="4" fill="#DDFBFF"/>
  <!-- Shaft with Etched Conduits -->
  <rect x="54" y="38" width="52" height="6" fill="#181B22"/>
  <line x1="56" y1="40" x2="102" y2="40" stroke="#1BB2BF" stroke-width="2"/>
  <rect x="70" y="38" width="4" height="2" fill="#55E6F2"/>
  <rect x="86" y="42" width="4" height="2" fill="#55E6F2"/>
  <!-- Optical Prism Tip -->
  <polygon points="106,35 118,41 106,47" fill="#55E6F2" stroke="#DDFBFF" stroke-width="1"/>
</svg>
