<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <rect width="128" height="128" fill="#0A0C10" />
  <!-- The Lantern at the Edge of Memory -->
  <!-- Handle -->
  <path d="M48,24 Q64,10 80,24" fill="none" stroke="#C99738" stroke-width="4"/>
  <!-- Dome Top -->
  <polygon points="40,36 64,24 88,36" fill="#0E5C35" stroke="#C99738" stroke-width="2"/>
  <!-- Hexagonal Glass Housing -->
  <rect x="42" y="36" width="44" height="56" fill="#0B1626" stroke="#C99738" stroke-width="3"/>
  <line x1="56" y1="36" x2="56" y2="92" stroke="#6B4E1B" stroke-width="2"/>
  <line x1="72" y1="36" x2="72" y2="92" stroke="#6B4E1B" stroke-width="2"/>
  <!-- Suspended Lumen Core -->
  <circle cx="64" cy="64" r="12" fill="#FAD06C"/>
  <circle cx="64" cy="64" r="6" fill="#FFF3D1"/>
  <!-- Base -->
  <rect x="36" y="92" width="56" height="12" fill="#0E5C35" stroke="#C99738" stroke-width="2"/>
</svg>
