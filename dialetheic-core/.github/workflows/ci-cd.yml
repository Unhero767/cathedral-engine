name: Build & Push Cathedral-Engine Image

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'codex/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME: dialetheic-core

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=v3.0.0
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify image
      if: github.event_name == 'pull_request'
      run: |
        docker run --rm ${{ steps.meta.outputs.tags }} python3 -c "import fastapi; print(f'FastAPI {fastapi.__version__}')"

    - name: Notify deployment
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Image pushed: ${{ steps.meta.outputs.tags }}"
        echo "Deploy with: kubectl apply -f k8s-deployment.yaml"
