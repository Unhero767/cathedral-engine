apiVersion: apps/v1
kind: Deployment
metadata:
  name: cathedral-engine
  namespace: default
  labels:
    app: cathedral-engine
    version: v3.0.0-ultra-interactive
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cathedral-engine
  template:
    metadata:
      labels:
        app: cathedral-engine
        version: v3.0.0-ultra-interactive
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - cathedral-engine
              topologyKey: kubernetes.io/hostname
      containers:
      - name: cathedral-engine
        image: herounhero/dialetheic-core:v3.0.0-ultra-interactive
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: DATA_DIR
          value: /app/data
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: cathedral-config
              key: cors_origins
              optional: true
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: cathedral-config
              key: log_level
              optional: true
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: cathedral-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: cathedral-engine
  namespace: default
  labels:
    app: cathedral-engine
spec:
  type: LoadBalancer
  selector:
    app: cathedral-engine
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cathedral-config
  namespace: default
data:
  cors_origins: "*"
  log_level: "info"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cathedral-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cathedral-engine-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cathedral-engine
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
