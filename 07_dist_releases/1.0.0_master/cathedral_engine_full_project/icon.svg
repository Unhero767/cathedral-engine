<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" fill="#050505" rx="16"/>
  <!-- Outer Gold Ring (36-Chamber Ring III Boundary) -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#DAA520" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- Middle Emerald Ring (Ring II) -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#50C878" stroke-width="1.5"/>
  <!-- Inner Cyan Ring (Ring I) -->
  <circle cx="64" cy="64" r="26" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="2,2"/>
  
  <!-- Sacred Geometry Cathedral Spire & Tensegrity Diamond -->
  <polygon points="64,14 110,64 64,114 18,64" fill="none" stroke="#DAA520" stroke-width="2"/>
  <polygon points="64,24 100,64 64,104 28,64" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.7"/>
  
  <!-- Central Oculus Core / 42.0 Hz Carrier Anchor -->
  <circle cx="64" cy="64" r="8" fill="#DAA520"/>
  <circle cx="64" cy="64" r="4" fill="#050505"/>
  <circle cx="64" cy="64" r="1.5" fill="#00E5FF"/>
  
  <!-- Cross Filaments (A-Field Curvature Axes) -->
  <line x1="64" y1="6" x2="64" y2="122" stroke="#DAA520" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="64" x2="122" y2="64" stroke="#DAA520" stroke-width="1" opacity="0.6"/>
  <line x1="23" y1="23" x2="105" y2="105" stroke="#50C878" stroke-width="0.8" opacity="0.4"/>
  <line x1="105" y1="23" x2="23" y2="105" stroke="#50C878" stroke-width="0.8" opacity="0.4"/>
</svg>
