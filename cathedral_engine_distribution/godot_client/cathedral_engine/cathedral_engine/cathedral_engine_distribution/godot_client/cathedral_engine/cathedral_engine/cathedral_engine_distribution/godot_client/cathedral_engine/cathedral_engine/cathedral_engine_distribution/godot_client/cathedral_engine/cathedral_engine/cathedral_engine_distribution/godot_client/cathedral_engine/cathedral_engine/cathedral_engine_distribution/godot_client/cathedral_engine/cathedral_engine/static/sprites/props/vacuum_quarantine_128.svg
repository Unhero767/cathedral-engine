<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <rect width="128" height="128" fill="#0A0C10" />
  <!-- Negative-Space Paradox Container Box -->
  <!-- Charcoal Frame -->
  <rect x="24" y="24" width="80" height="80" fill="#0A0C10" stroke="#2E3440" stroke-width="6"/>
  <!-- Cyan Boundary Accents -->
  <rect x="30" y="30" width="68" height="68" fill="none" stroke="#1BB2BF" stroke-width="1"/>
  <!-- Floating Unstable Paradox Glyph (1=0) -->
  <text x="64" y="72" fill="#FF5C5C" font-size="28" font-weight="bold" text-anchor="middle" font-family="monospace">1≠0</text>
</svg>
