<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges">
  <rect width="128" height="128" fill="#07090e"/>
  <!-- Ring 1 (Sensory) -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <!-- Ring 2 (Emotional) -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="6 3"/>
  <!-- Ring 3 (Memory) -->
  <circle cx="64" cy="64" r="20" fill="none" stroke="#ef4444" stroke-width="2"/>
  <!-- Central Radiant Quartz Node -->
  <polygon points="64,52 74,64 64,76 54,64" fill="#00e5ff" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="3" fill="#ffffff"/>
</svg>