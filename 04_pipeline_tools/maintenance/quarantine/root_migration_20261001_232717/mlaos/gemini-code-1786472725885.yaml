governance: "Human Sovereignty enforced"
articles:
  - id: "C-01"
    name: "Never-Overwrite"
    statement: "No canonical state is silently destroyed. S_{t+1} = S_t \oplus \Delta_t"
  - id: "C-02"
    name: "Human Sovereignty"
    statement: "AI may generate, critique, transform, and simulate, but possesses no canonical authority."
  - id: "C-03"
    name: "Paraconsistent Stability"
    statement: "Contradiction is preserved as information when intentional. P & ¬P does not collapse the system."
  - id: "C-04"
    name: "Invariant Preservation"
    statement: "An idea may change representation without losing its defining invariant: I(A) = I(B)."
  - id: "C-05"
    name: "Canonical Promotion"
    statement: "Promotion requires structural necessity, invariant compatibility, Crucible review, and human approval."
  - id: "C-06"
    name: "Reality Gradient"
    statement: "Metaphor, specification, prototype, implementation, and validation remain strictly distinguishable (R0-R5)."
  - id: "C-07"
    name: "Complexity Accountability"
    statement: "Every architectural layer must justify its complexity budget. ΔU > αB."
  - id: "C-08"
    name: "Executability"
    statement: "Important abstractions must have an identifiable path toward computational implementation."
  - id: "C-09"
    name: "Adversarial Review"
    statement: "Every major subsystem must eventually be subjected to deliberate Crucible attack."
  - id: "C-10"
    name: "Null Termination"
    statement: "Recursive expansion and mythology generation must possess a legitimate stopping condition."