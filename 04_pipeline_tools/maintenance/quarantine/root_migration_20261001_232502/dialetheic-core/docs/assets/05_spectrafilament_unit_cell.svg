<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66fcf1" />
      <stop offset="100%" stop-color="#1f2833" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="#0b0c10" rx="10"/>
  <text x="250" y="35" fill="#66fcf1" font-family="Courier New" font-size="18" font-weight="bold" text-anchor="middle">SPECTRAFILAMENT :: LIVING UNIT CELL</text>

  <g transform="translate(250, 200)">
    <!-- Prismatic Core -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#1f2833" stroke="#66fcf1" stroke-width="3"/>
    <circle cx="0" cy="0" r="20" fill="#ffd700"/>
    <text x="0" y="5" fill="#000" font-family="Courier New" font-size="9" font-weight="bold" text-anchor="middle">μ-Oculus</text>

    <!-- Crown Fins -->
    <path d="M 0 -60 L -20 -110 L 20 -110 Z" fill="none" stroke="#8a2be2" stroke-width="2"/>
    <text x="0" y="-120" fill="#8a2be2" font-family="Courier New" font-size="10" text-anchor="middle">Crown-Fin (A-Field Coupling)</text>

    <!-- Tendon Cables -->
    <line x1="-52" y1="0" x2="-160" y2="0" stroke="#ff4d4d" stroke-width="3"/>
    <line x1="52" y1="0" x2="160" y2="0" stroke="#ff4d4d" stroke-width="3"/>
    <text x="-110" y="-10" fill="#ff4d4d" font-family="Courier New" font-size="10" text-anchor="middle">Tendon Cable</text>
    <text x="110" y="-10" fill="#ff4d4d" font-family="Courier New" font-size="10" text-anchor="middle">Phase Transmission</text>
  </g>
</svg>
