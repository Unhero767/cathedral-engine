<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66fcf1" />
      <stop offset="100%" stop-color="#1f2833" />
    </linearGradient>
  </defs>
  <rect width="500" height="350" fill="#0b0c10" rx="10"/>
  <text x="250" y="35" fill="#66fcf1" font-family="Courier New" font-size="18" font-weight="bold" text-anchor="middle">KINETIC TURBINE &amp; THERMAL METRICS</text>

  <!-- Speedometer Arc -->
  <path d="M 80 220 A 120 120 0 0 1 320 220" fill="none" stroke="#333" stroke-width="16"/>
  <path d="M 80 220 A 120 120 0 0 1 270 120" fill="none" stroke="#ffd700" stroke-width="16"/>
  
  <circle cx="200" cy="220" r="12" fill="#ffd700"/>
  <line x1="200" y1="220" x2="260" y2="130" stroke="#ffd700" stroke-width="4"/>
  <text x="200" y="260" fill="#ffd700" font-family="Courier New" font-size="16" font-weight="bold" text-anchor="middle">140.03 RPM</text>

  <!-- Thermal Gauge -->
  <rect x="380" y="80" width="30" height="180" fill="#1f2833" stroke="#ff4d4d" stroke-width="2" rx="6"/>
  <rect x="384" y="160" width="22" height="96" fill="#ff4d4d" rx="4"/>
  <text x="395" y="285" fill="#ff4d4d" font-family="Courier New" font-size="12" font-weight="bold" text-anchor="middle">308.5K</text>
  <text x="395" y="305" fill="#aaa" font-family="Courier New" font-size="10" text-anchor="middle">A-Field Temp</text>
</svg>
