<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66fcf1" />
      <stop offset="100%" stop-color="#1f2833" />
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="#0b0c10" rx="10"/>
  <text x="250" y="35" fill="#66fcf1" font-family="Courier New" font-size="18" font-weight="bold" text-anchor="middle">SEVEN SPECTRAL CONSTANTS</text>
  
  <g transform="translate(250,250)">
    <!-- Gold -->
    <path d="M 0 0 L 0 -160 A 160 160 0 0 1 120 -105 Z" fill="#ffd700" opacity="0.85"/>
    <!-- Teal -->
    <path d="M 0 0 L 120 -105 A 160 160 0 0 1 156 35 Z" fill="#66fcf1" opacity="0.85"/>
    <!-- Blue -->
    <path d="M 0 0 L 156 35 A 160 160 0 0 1 80 138 Z" fill="#4169e1" opacity="0.85"/>
    <!-- Red -->
    <path d="M 0 0 L 80 138 A 160 160 0 0 1 -40 155 Z" fill="#ff4d4d" opacity="0.85"/>
    <!-- Violet -->
    <path d="M 0 0 L -40 155 A 160 160 0 0 1 -138 80 Z" fill="#8a2be2" opacity="0.85"/>
    <!-- Emerald -->
    <path d="M 0 0 L -138 80 A 160 160 0 0 1 -140 -80 Z" fill="#50c878" opacity="0.85"/>
    <!-- Bronze Obsidian Null -->
    <path d="M 0 0 L -140 -80 A 160 160 0 0 1 0 -160 Z" fill="#8b4513" opacity="0.85"/>
    <circle cx="0" cy="0" r="40" fill="#0b0c10" stroke="#fff" stroke-width="2"/>
    <text x="0" y="5" fill="#fff" font-family="Courier New" font-size="11" font-weight="bold" text-anchor="middle">A-FIELD</text>
  </g>
</svg>
