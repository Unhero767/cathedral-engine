<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66fcf1" />
      <stop offset="100%" stop-color="#1f2833" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="#0b0c10" rx="10"/>
  <text x="250" y="35" fill="#66fcf1" font-family="Courier New" font-size="18" font-weight="bold" text-anchor="middle">JANUS ENGINE :: TRIPLE-STATE VARIANCE</text>

  <!-- 4 Truth Nodes: T, F, B, N -->
  <circle cx="120" cy="150" r="35" fill="#1f2833" stroke="#50c878" stroke-width="3"/>
  <text x="120" y="155" fill="#50c878" font-family="Courier New" font-size="16" font-weight="bold" text-anchor="middle">T</text>
  <text x="120" y="205" fill="#aaa" font-family="Courier New" font-size="10" text-anchor="middle">True</text>

  <circle cx="380" cy="150" r="35" fill="#1f2833" stroke="#ff4d4d" stroke-width="3"/>
  <text x="380" y="155" fill="#ff4d4d" font-family="Courier New" font-size="16" font-weight="bold" text-anchor="middle">F</text>
  <text x="380" y="205" fill="#aaa" font-family="Courier New" font-size="10" text-anchor="middle">False</text>

  <circle cx="250" cy="150" r="40" fill="#1f2833" stroke="#ffd700" stroke-width="4"/>
  <text x="250" y="155" fill="#ffd700" font-family="Courier New" font-size="18" font-weight="bold" text-anchor="middle">B</text>
  <text x="250" y="205" fill="#ffd700" font-family="Courier New" font-size="10" font-weight="bold" text-anchor="middle">Both (Dialetheic)</text>

  <circle cx="250" cy="300" r="35" fill="#11151c" stroke="#8a2be2" stroke-width="3"/>
  <text x="250" y="305" fill="#8a2be2" font-family="Courier New" font-size="16" font-weight="bold" text-anchor="middle">N</text>
  <text x="250" y="355" fill="#aaa" font-family="Courier New" font-size="10" text-anchor="middle">Neither (Ontological Horizon)</text>
</svg>
