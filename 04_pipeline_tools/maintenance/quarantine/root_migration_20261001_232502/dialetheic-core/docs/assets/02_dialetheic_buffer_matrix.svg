<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66fcf1" />
      <stop offset="100%" stop-color="#1f2833" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="#0b0c10" rx="10"/>
  <text x="250" y="35" fill="#66fcf1" font-family="Courier New" font-size="18" font-weight="bold" text-anchor="middle">DIALETHEIC BUFFER &amp; METAMORPHIC SQUEEZE</text>
  <!-- Paradox Injection -->
  <rect x="30" y="80" width="130" height="80" fill="#1f2833" stroke="#ff4040" stroke-width="2" rx="4"/>
  <text x="95" y="115" fill="#ff4040" font-family="Courier New" font-size="12" font-weight="bold" text-anchor="middle">PARADOX (P ∧ ¬P)</text>
  <text x="95" y="135" fill="#aaa" font-family="Courier New" font-size="10" text-anchor="middle">Load >= 7.5</text>
  <!-- Squeeze Arrow -->
  <path d="M 160 120 L 220 120" stroke="#66fcf1" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Buffer Core -->
  <circle cx="290" cy="120" r="45" fill="#11151c" stroke="#8b4513" stroke-width="4"/>
  <text x="290" y="115" fill="#ffd700" font-family="Courier New" font-size="11" font-weight="bold" text-anchor="middle">SQUEEZE</text>
  <text x="290" y="130" fill="#8b4513" font-family="Courier New" font-size="10" text-anchor="middle">0.1K BRONZE</text>
  <!-- Scars vs Quarantine Outputs -->
  <rect x="50" y="240" width="180" height="100" fill="#1f2833" stroke="#66fcf1" stroke-width="2" rx="4"/>
  <text x="140" y="270" fill="#66fcf1" font-family="Courier New" font-size="12" font-weight="bold" text-anchor="middle">HARMONIC SCAR</text>
  <text x="140" y="295" fill="#c5c6c7" font-family="Courier New" font-size="10" text-anchor="middle">Load &lt; 7.5 | State 'B'</text>
  <text x="140" y="315" fill="#aaa" font-family="Courier New" font-size="10" text-anchor="middle">Capacity = ln(1+10*L)</text>
  
  <rect x="270" y="240" width="180" height="100" fill="#1f2833" stroke="#ff4040" stroke-width="2" rx="4"/>
  <text x="360" y="270" fill="#ff4040" font-family="Courier New" font-size="12" font-weight="bold" text-anchor="middle">CRYOGENIC QUARANTINE</text>
  <text x="360" y="295" fill="#c5c6c7" font-family="Courier New" font-size="10" text-anchor="middle">Load &gt;= 7.5 | 0.1K Obsidian</text>
  <text x="360" y="315" fill="#aaa" font-family="Courier New" font-size="10" text-anchor="middle">Metalogic Burn Shielded</text>
</svg>
