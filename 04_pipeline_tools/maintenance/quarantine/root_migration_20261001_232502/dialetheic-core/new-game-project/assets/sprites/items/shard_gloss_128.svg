<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <rect width="128" height="128" fill="#0A0C10" />
  <!-- Alexandrian Cryptographic Memory Chip -->
  <polygon points="40,32 96,32 88,88 32,88" fill="#0B1626" stroke="#1BB2BF" stroke-width="2"/>
  <!-- Golden High-Pali Code Lines -->
  <line x1="42" y1="44" x2="86" y2="44" stroke="#FAD06C" stroke-width="2" stroke-dasharray="4 2"/>
  <line x1="40" y1="54" x2="84" y2="54" stroke="#FAD06C" stroke-width="2" stroke-dasharray="6 3"/>
  <line x1="38" y1="64" x2="82" y2="64" stroke="#FAD06C" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="36" y1="74" x2="80" y2="74" stroke="#FAD06C" stroke-width="2" stroke-dasharray="5 2"/>
  <!-- Gold Terminal Pins -->
  <rect x="36" y="88" width="6" height="8" fill="#C99738"/>
  <rect x="48" y="88" width="6" height="8" fill="#C99738"/>
  <rect x="60" y="88" width="6" height="8" fill="#C99738"/>
  <rect x="72" y="88" width="6" height="8" fill="#C99738"/>
</svg>
