  <polygon points="94,38 94,82 64,88 64,54" fill="#C99738"/>
  <polygon points="34,82 64,88 64,108" fill="#2B1D04"/>
  <polygon points="94,82 64,108 64,88" fill="#6B4E1B"/>
  <!-- Specular Vertex Flares -->
  <rect x="62" y="16" width="4" height="4" fill="#FFFFFF"/>
