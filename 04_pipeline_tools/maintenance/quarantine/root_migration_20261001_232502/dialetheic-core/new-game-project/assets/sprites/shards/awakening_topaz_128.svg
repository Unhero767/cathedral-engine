  <polygon points="64,18 94,38 94,82 64,108 34,82 34,38" fill="#C99738" stroke="#2B1D04" stroke-width="2"/>
  <!-- Facets -->
  <polygon points="64,18 64,54 34,38" fill="#FAD06C"/>
  <polygon points="64,18 94,38 64,54" fill="#FFF3D1"/>
