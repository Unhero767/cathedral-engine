services:
  cathedral-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cathedral_engine_backend
    ports:
      - "8000:8000"
    volumes:
      - ./02_engine_core/telemetry:/app/telemetry
    environment:
      - PYTHONUNBUFFERED=1
      - SQLITE_WAL_MODE=true
    restart: unless-stopped
    command: uvicorn 02_engine_core.logic_engines.auth_service:app --host 0.0.0.0 --port 8000 --reload
